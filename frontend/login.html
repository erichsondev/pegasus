<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus Finance - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #007bff;
            --cor-primaria-hover: #0056b3;
            --cor-fundo: #f0f8ff;
            --cor-texto: #333;
            --cor-branco: #ffffff;
            --sombra-card: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cor-fundo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-container {
            background-color: var(--cor-branco);
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--sombra-card);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-top: 0;
            margin-bottom: 10px;
        }

        .auth-container .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: var(--cor-primaria);
            color: white;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: var(--cor-primaria-hover);
        }

        .links-container {
            margin-top: 25px;
            font-size: 0.9em;
        }

        .links-container p {
            margin: 10px 0 0 0;
        }
        
        .links-container a {
            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: 600;
        }
        
        .links-container a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Bem-vindo de volta!</h1>
        <p class="subtitle">Faça login para acessar o Pegasus Finance.</p>
        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div class="links-container">
            <a href="./recuperar-senha.html">Esqueceu a senha?</a>
            <p>Não tem uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'https://pegasus-backend-al0z.onrender.com';
        const formLogin = document.getElementById('form-login');

        formLogin.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const response = await fetch(`${API_URL}/usuarios/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, senha }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao fazer login.');
                }

                // Guarda o token e os dados do usuário no navegador
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                // Redireciona para a tela principal do sistema
                // ATENÇÃO: Iremos mudar isso para 'menu.html' no futuro
                window.location.href = './index.html'; 

            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        });
    </script>
</body>
</html>
