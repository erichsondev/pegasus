<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus Finance - Recuperar Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #007bff;
            --cor-primaria-hover: #0056b3;
            --cor-fundo: #f0f8ff;
            --cor-texto: #333;
            --cor-branco: #ffffff;
            --sombra-card: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cor-fundo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-container {
            background-color: var(--cor-branco);
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--sombra-card);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-top: 0;
            margin-bottom: 10px;
        }

        .auth-container .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: var(--cor-primaria);
            color: white;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: var(--cor-primaria-hover);
        }

        .links-container {
            margin-top: 25px;
            font-size: 0.9em;
        }
        
        .links-container a {
            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: 600;
        }
        
        .links-container a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Recuperar Senha</h1>
        <p class="subtitle">Insira seu e-mail e enviaremos um link para você voltar a acessar sua conta.</p>
        <form id="form-recuperar">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <button type="submit">Enviar link de recuperação</button>
        </form>
        <div class="links-container">
            <a href="./login.html">Voltar para o Login</a>
        </div>
    </div>

            //         throw new Error(data.message || 'Não foi possível iniciar a recuperação.');

            //     alert('Se uma conta com este e-mail existir, um link de recuperação foi enviado.');

            // } catch (error) {
            //     alert(`Erro: ${error.message}`);

            formRecuperar.reset();

    </script>
</body>
</html>
