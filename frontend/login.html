        /* O CSS é idêntico ao da página de cadastro, então vou omitir para economizar espaço */
        :root { --cor-primaria: #007bff; --cor-primaria-hover: #0056b3; --cor-fundo: #f0f8ff; --cor-texto: #333; --cor-branco: #ffffff; --sombra-card: 0 4px 8px rgba(0, 0, 0, 0.1); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--cor-fundo); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; background-color: var(--cor-primaria); color: white; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--cor-primaria-hover); }
        .link-alternativo { margin-top: 20px; }
        .link-alternativo a { color: var(--cor-primaria); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Login - Pegasus</h1>
        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div class="link-alternativo">
            <p>Não tem uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'https://pegasus-backend-57kd.onrender.com/api'; // Use a URL do seu backend no Render
        const formLogin = document.getElementById('form-login');

        formLogin.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const response = await fetch(`${API_URL}/usuarios/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, senha }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao fazer login.');
                }

                // A MÁGICA ACONTECE AQUI:
                // 1. Guarda o "crachá digital" (token) no navegador
                localStorage.setItem('token', data.token);
                // 2. Guarda os dados do usuário para mostrar o nome, etc.
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                // 3. Redireciona para a tela principal do sistema
                window.location.href = './index.html';

            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        });
    </script>
</body>
</html>
